{% extends "movies/base.html" %}
{% block content %}
<h2>Загрузка JSON/XML-файла</h2>
<form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    <div class="mb-3">
        <input type="file" name="file" accept=".json,.xml" class="form-control" required>
    </div>
    <button type="submit" class="btn btn-primary">Загрузить</button>
</form>
{% endblock %}
